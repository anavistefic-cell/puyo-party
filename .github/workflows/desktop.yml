name: Build Desktop Apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run css
      - name: Copy game into desktop app
        shell: bash
        run: mkdir -p desktop/app && cp www/index.html desktop/app/index.html
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/PuyoParty-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete desktop --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create desktop out/* --repo ${{ github.repository }} --title "Puyo Party Desktop" --notes "Windows: PuyoParty-Windows.exe (portable, just run it). Mac: PuyoParty-Mac.zip. Linux: PuyoParty-Linux.AppImage."
